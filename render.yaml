# Devnet preview only. The free PostgreSQL instance expires after 30 days.
# Upload the reward signer as a Render secret file before the first healthy deploy.
services:
  - type: web
    name: haokhi-devnet
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    numInstances: 1
    dockerContext: ./vietnam-history-gamefi
    dockerfilePath: ./vietnam-history-gamefi/deploy/devnet/backend.Dockerfile
    healthCheckPath: /api/health/ready
    envVars:
      - key: DEVNET_DEPLOYED
        value: "true"
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLANA_PROGRAM_ID
        value: 8qUBTgX99v5EhxbAaxuqS94rgfRhnLrTgW66Gh9BvLKN
      - key: DATABASE_AUTO_CREATE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: haokhi-devnet-db
          property: connectionString
      - key: REWARD_DISTRIBUTOR_KEYPAIR_PATH
        value: /etc/secrets/devnet-reward-distributor-keypair.json

databases:
  - name: haokhi-devnet-db
    plan: free
    region: singapore
    ipAllowList: []
